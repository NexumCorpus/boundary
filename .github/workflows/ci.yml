name: ci
on:
  push:
  pull_request:
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python reproduce.py
      - name: RHB replication protocol, every number recomputed
        run: python replication/rhb/verify.py
      - name: Tree stays clean after the check
        shell: bash
        run: test -z "$(git status --porcelain)"
